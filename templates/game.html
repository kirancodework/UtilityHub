<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BSS Breakroom Arcade</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
    }
    .top-bar {
      display: flex;
      gap: 10px;
      background-color: #1e293b;
      padding: 10px 15px;
      border-radius: 8px;
      border: 1px solid #334155;
      margin-bottom: 25px;
      align-items: center;
    }
    .home-btn {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .home-btn:hover { background-color: #1d4ed8; }
    
    .game-nav {
      display: flex;
      gap: 8px;
      margin-left: 20px;
    }
    .subtab-btn {
      background-color: transparent;
      color: #94a3b8;
      border: 1px solid #475569;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .subtab-btn.active {
      background-color: #3b82f6;
      color: #ffffff;
      border-color: #3b82f6;
    }

    .game-container {
      max-width: 700px;
      margin: 0 auto;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      text-align: center;
    }

    .game-panel { display: none; }
    .game-panel.active { display: block; }

    /* Game 1: Bug Smasher */
    canvas { background: #020617; border: 2px solid #38bdf8; border-radius: 8px; cursor: crosshair; }
    .hud { font-size: 1.2rem; margin-bottom: 12px; color: #38bdf8; font-weight: bold; }

    /* Game 2: Trivia Quiz */
    .quiz-options { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
    .quiz-btn { background: #0f172a; color: #f8fafc; border: 1px solid #475569; padding: 12px; border-radius: 6px; cursor: pointer; text-align: left; }
    .quiz-btn:hover { background: #334155; border-color: #38bdf8; }

    /* Game 3: Memory Match */
    .memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 20px; }
    .card { height: 80px; background: #0f172a; border: 2px solid #334155; border-radius: 8px; font-size: 2rem; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
    .card.flipped, .card.matched { background: #334155; border-color: #38bdf8; }
  </style>
</head>
<body>

  <div class="top-bar">
    <button class="home-btn" onclick="window.location.href='/'">🏠 Home</button>
    <div class="game-nav">
      <button class="subtab-btn active" onclick="switchGame('smasher', this)">👾 Bug Smasher</button>
      <button class="subtab-btn" onclick="switchGame('quiz', this)">🧠 Telecom Quiz</button>
      <button class="subtab-btn" onclick="switchGame('memory', this)">🎴 Memory Match</button>
    </div>
  </div>

  <div class="game-container">
    <!-- SUBGAME 1: BUG SMASHER -->
    <div id="game-smasher" class="game-panel active">
      <h2>👾 BSS Bug Smasher</h2>
      <div class="hud">Score: <span id="smasher-score">0</span></div>
      <canvas id="gameCanvas" width="600" height="350"></canvas>
    </div>

    <!-- SUBGAME 2: TELECOM QUIZ -->
    <div id="game-quiz" class="game-panel">
      <h2>🧠 BSS & Telecom Trivia</h2>
      <div class="hud">Score: <span id="quiz-score">0</span></div>
      <p id="quiz-question" style="font-size: 1.1rem;">Question goes here...</p>
      <div class="quiz-options" id="quiz-options"></div>
    </div>

    <!-- SUBGAME 3: MEMORY MATCH -->
    <div id="game-memory" class="game-panel">
      <h2>🎴 System Memory Match</h2>
      <div class="hud">Pairs Found: <span id="memory-score">0</span>/4</div>
      <div class="memory-grid" id="memory-grid"></div>
    </div>
  </div>

  <script>
    // Tab Switcher
    function switchGame(gameId, btn) {
      document.querySelectorAll('.game-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.subtab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('game-' + gameId).classList.add('active');
      btn.classList.add('active');
    }

    // --- GAME 1: BUG SMASHER CODE ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let smasherScore = 0;
    let bug = { x: 200, y: 150, radius: 18, dx: 3, dy: 3 };

    function drawBug() {
      ctx.beginPath();
      ctx.arc(bug.x, bug.y, bug.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#ef4444";
      ctx.fill();
      ctx.closePath();
    }

    function updateSmasher() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      bug.x += bug.dx;
      bug.y += bug.dy;

      if (bug.x + bug.radius > canvas.width || bug.x - bug.radius < 0) bug.dx *= -1;
      if (bug.y + bug.radius > canvas.height || bug.y - bug.radius < 0) bug.dy *= -1;

      drawBug();
      requestAnimationFrame(updateSmasher);
    }

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const dist = Math.hypot((e.clientX - rect.left) - bug.x, (e.clientY - rect.top) - bug.y);
      if (dist < bug.radius) {
        smasherScore += 10;
        document.getElementById('smasher-score').innerText = smasherScore;
        bug.x = Math.random() * (canvas.width - 40) + 20;
        bug.y = Math.random() * (canvas.height - 40) + 20;
        bug.dx = (Math.random() > 0.5 ? 1 : -1) * (3 + smasherScore / 10);
        bug.dy = (Math.random() > 0.5 ? 1 : -1) * (3 + smasherScore / 10);
      }
    });
    updateSmasher();

    // --- GAME 2: QUIZ CODE ---
    const quizData = [
      { q: "What does MSISDN stand for?", opts: ["Mobile Subscriber Integrated Services Digital Network Number", "Main Station Identification System Data Network", "Modular System International Subscriber Data Number"], ans: 0 },
      { q: "Which BSS module handles rating and charging?", opts: ["ESB", "Billing Engine", "ARM"], ans: 1 },
      { q: "What length is a standard ICCID?", opts: ["15 digits", "20 digits", "10 digits"], ans: 1 }
    ];
    let currentQ = 0, quizScore = 0;

    function renderQuestion() {
      if (currentQ >= quizData.length) {
        document.getElementById('quiz-question').innerText = "Quiz Completed! Outstanding job!";
        document.getElementById('quiz-options').innerHTML = `<button class="quiz-btn" onclick="resetQuiz()">Play Again</button>`;
        return;
      }
      const q = quizData[currentQ];
      document.getElementById('quiz-question').innerText = q.q;
      const optsContainer = document.getElementById('quiz-options');
      optsContainer.innerHTML = '';
      q.opts.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'quiz-btn';
        btn.innerText = opt;
        btn.onclick = () => {
          if (idx === q.ans) quizScore += 10;
          currentQ++;
          document.getElementById('quiz-score').innerText = quizScore;
          renderQuestion();
        };
        optsContainer.appendChild(btn);
      });
    }
    function resetQuiz() { currentQ = 0; quizScore = 0; document.getElementById('quiz-score').innerText = 0; renderQuestion(); }
    renderQuestion();

    // --- GAME 3: MEMORY MATCH CODE ---
    const icons = ['📡', '🖥️', '💾', '⚙️', '📡', '🖥️', '💾', '⚙️'];
    let flippedCards = [], matchedPairs = 0;

    function initMemoryGame() {
      const grid = document.getElementById('memory-grid');
      grid.innerHTML = '';
      const shuffled = icons.sort(() => 0.5 - Math.random());
      shuffled.forEach((symbol, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.symbol = symbol;
        card.dataset.id = idx;
        card.onclick = () => flipCard(card);
        grid.appendChild(card);
      });
    }

    function flipCard(card) {
      if (flippedCards.length < 2 && !card.classList.contains('flipped') && !card.classList.contains('matched')) {
        card.classList.add('flipped');
        card.innerText = card.dataset.symbol;
        flippedCards.push(card);

        if (flippedCards.length === 2) {
          if (flippedCards[0].dataset.symbol === flippedCards[1].dataset.symbol) {
            flippedCards.forEach(c => c.classList.add('matched'));
            matchedPairs++;
            document.getElementById('memory-score').innerText = matchedPairs;
            flippedCards = [];
          } else {
            setTimeout(() => {
              flippedCards.forEach(c => { c.classList.remove('flipped'); c.innerText = ''; });
              flippedCards = [];
            }, 800);
          }
        }
      }
    }
    initMemoryGame();
  </script>
</body>
</html>

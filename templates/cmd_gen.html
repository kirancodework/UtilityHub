<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unix Command Generator AI</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .tab-bar { display: flex; gap: 10px; background-color: #1e293b; padding: 10px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 20px; }
    .home-btn { background-color: #3b82f6; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .home-btn:hover { background-color: #2563eb; }
    
    .container { max-width: 800px; margin: 0 auto; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.4); }
    h1 { color: #f8fafc; margin-top: 0; }
    .subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }
    
    textarea { width: 100%; height: 100px; background-color: #0f172a; border: 1px solid #475569; color: #f8fafc; padding: 12px; border-radius: 6px; box-sizing: border-box; resize: vertical; font-family: inherit; }
    textarea:focus { border-color: #38bdf8; outline: none; }
    
    button.btn-generate { background-color: #10b981; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; }
    button.btn-generate:hover { background-color: #059669; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .output-box { margin-top: 25px; background: #020617; border: 1px solid #334155; border-radius: 8px; padding: 15px; position: relative; }
    .output-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 8px; margin-bottom: 12px; }
    .output-title { font-size: 0.85rem; color: #38bdf8; font-weight: bold; text-transform: uppercase; }
    .copy-btn { background: #334155; color: #f8fafc; border: none; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; }
    .copy-btn:hover { background: #475569; }
    
    pre { margin: 0; white-space: pre-wrap; font-family: 'Courier New', Courier, monospace; color: #a7f3d0; font-size: 0.95rem; }
  </style>
</head>
<body>

  <div class="tab-bar">
    <button class="home-btn" onclick="window.location.href='/'">🏠 Home</button>
  </div>

  <div class="container">
    <h1>🐚 Unix Command Assistant</h1>
    <p class="subtitle">Powered by local model <code>qwen2.5-coder:7b</code> via Ollama</p>

    <label for="prompt"><strong>Describe what command or script you need:</strong></label>
    <textarea id="prompt" placeholder="E.g., Find all .log files larger than 100MB modified in the last 7 days and delete them..."></textarea>
    
    <button id="genBtn" class="btn-generate" onclick="generateCommand()">Generate Command</button>

    <div class="output-box">
      <div class="output-header">
        <span class="output-title">Generated Output</span>
        <button class="copy-btn" onclick="copyOutput()">📋 Copy</button>
      </div>
      <pre id="output">Waiting for request...</pre>
    </div>
  </div>

  <script>
    async function generateCommand() {
      const promptText = document.getElementById('prompt').value.trim();
      const outputElem = document.getElementById('output');
      const btn = document.getElementById('genBtn');

      if (!promptText) return alert('Please enter a request.');

      btn.disabled = true;
      btn.innerText = 'Generating...';
      outputElem.innerText = '';

      try {
        const response = await fetch('/api/generate-cmd', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: promptText })
        });

        const data = await response.json();
        if (data.status === 'SUCCESS') {
          outputElem.innerText = data.result;
        } else {
          outputElem.innerText = 'Error: ' + data.error;
        }
      } catch (err) {
        outputElem.innerText = 'Failed to communicate with server: ' + err.message;
      } finally {
        btn.disabled = false;
        btn.innerText = 'Generate Command';
      }
    }

    function copyOutput() {
      const text = document.getElementById('output').innerText;
      navigator.clipboard.writeText(text);
      alert('Copied to clipboard!');
    }
  </script>
</body>
</html>
